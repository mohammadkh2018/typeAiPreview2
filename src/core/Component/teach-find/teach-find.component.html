<div fxLayout="row" [dir]="data.Dir">

  <div fxFlex="100" fxLayout="row" fxLayout.xs="row">
    <mat-form-field style="width: 100%;">
      <input [(ngModel)]="JsonOutput.search" matInput
             [placeholder]="'برای جستجو تایپ کنید'"
             [dir]="data.Dir"
             #SearchInput>
    </mat-form-field>
  </div>
  <mat-icon *ngIf="Seraching" style="z-index: 100; position: absolute">
    <mat-spinner diameter="20">
    </mat-spinner>
  </mat-icon>

  <mat-icon class="close" (click)="onDismiss()">highlight_off</mat-icon>

</div>
  <!--<div fxLayout="row" style="padding: 3px;text-align: center">-->
    <!--<div fxFlex="10" class="column_tab">ردیف</div>-->
    <!--<div fxFlex="35" class="column_tab">کداستاد</div>-->
    <!--<div fxFlex="35" class="column_tab">نام و نام خانوادگی</div>-->
    <!--<div fxFlex="35" class="column_tab">دانشکده</div>-->
  <!--</div>-->
<div mat-dialog-content [dir]="data.Dir" style="overflow: hidden">
  <div
    [ngStyle]="{'height':'calc(100vh - 200px)','overflow-y':'scroll'}"
    (scroll)="ongridscroll($event)">
    <div *ngFor="let item of rowData;let i = index"
         style="margin-bottom: 5px; background: #e4f2ff" (click)="onConfirm(item)" class="pointer">
      <div fxLayout="row" fxLayout.xs="column" style="padding: 3px; text-align: center; font-weight: normal!important;">
        <div fxFlex="5"
             style="background: white;border-radius: 20px;margin-left: 10px;width: 25px;height: 25px;margin-right: 10px;text-align: center;">
          {{item.rownum}}
        </div>
        <div fxFlex="10" style="font-weight: normal!important;">{{item.teachCode}}</div>
        <div fxFlex="35" style="font-weight: normal!important;">{{item.myFamily}}</div>
        <div fxFlex="35" style="font-weight: normal!important;">{{item.myDepartmentName}}</div>
      </div>
    </div>
  </div>
</div>
