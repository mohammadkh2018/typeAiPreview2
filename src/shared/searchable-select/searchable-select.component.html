<mat-form-field appearance="outline" style="width: 100%;">
  <mat-label>{{ label }}</mat-label>

  <mat-select
    [formControl]="formControl"
    [compareWith]="compareFn"
    [disableOptionCentering]="true"
    [panelClass]="'select-with-search-panel'"
    (openedChange)="onDropdownOpen($event, searchInput)"
    (selectionChange)="onSelectChange($event.value)">

    <!-- فیلد جستجو -->
    <mat-option class="search-option" (click)="$event.stopPropagation()">
      <input
        #searchInput
        type="text"
        placeholder="جستجو کنید..."
        autocomplete="off"
        class="search-input"
        (input)="filterList(searchInput.value)"
        (click)="$event.stopPropagation()"
        (keydown)="$event.stopPropagation()"
      />
    </mat-option>

    <!-- گزینه‌ها -->
    <mat-option *ngFor="let item of filteredList" [value]="item[valueKey]">
      {{ item.title }}
    </mat-option>
  </mat-select>
</mat-form-field>
